[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "termfetch"
version = "0.2.0"
description = "A neofetch-style profile card for your GitHub README, rendered to a self-contained SVG."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sai Varun Thupakula" }]
keywords = ["github", "profile", "readme", "neofetch", "ascii-art", "svg"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
dependencies = ["pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/saivarun1410/termfetch"
Repository = "https://github.com/saivarun1410/termfetch"
Issues = "https://github.com/saivarun1410/termfetch/issues"
Changelog = "https://github.com/saivarun1410/termfetch/blob/main/CHANGELOG.md"

[project.scripts]
termfetch = "termfetch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["termfetch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
