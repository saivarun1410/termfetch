name: Bug report
description: Report a reproducible problem in termfetch.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to help improve termfetch.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the result you saw and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Use this config ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: termfetch version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and operating system
      placeholder: "Python 3.12.4 on macOS 15"
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant configuration or logs
      description: Remove tokens, private paths, and other sensitive information first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials and sensitive data from this report.
          required: true
